<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentLearn | 智能体模块化进阶工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .roadmap-grid {
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out;
        }
        .animate-slideUp {
            animation: slideUp 0.3s ease-out;
        }
        .courseware-content h1 { font-size: 1.4rem; font-weight: 800; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .courseware-content h2 { font-size: 1.2rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #1e293b; border-left: 4px solid #10b981; padding-left: 0.6rem; }
        .courseware-content h3 { font-size: 1.05rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #334155; }
        .courseware-content p { margin-bottom: 0.75rem; line-height: 1.7; color: #334155; }
        .courseware-content ul, .courseware-content ol { margin-left: 1.5rem; margin-bottom: 0.75rem; list-style-type: disc; }
        .courseware-content li { margin-bottom: 0.35rem; line-height: 1.6; }
        .courseware-content pre { background: #0f172a; color: #f8fafc; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; font-family: monospace; font-size: 0.85rem; margin-bottom: 1rem; border: 1px solid #334155; }
        .courseware-content code { background: #f1f5f9; color: #0f172a; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.85rem; font-weight: 600; }
        .courseware-content pre code { background: transparent; color: inherit; padding: 0; font-weight: normal; }
        .courseware-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.875rem; border-radius: 0.5rem; overflow: hidden; }
        .courseware-content th, .courseware-content td { border: 1px solid #e2e8f0; padding: 0.6rem 0.8rem; text-align: left; }
        .courseware-content th { background: #f8fafc; font-weight: 700; color: #1e293b; }
        .courseware-content blockquote { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; color: #1e40af; }
        .courseware-content hr { margin-top: 1.25rem; margin-bottom: 1.25rem; border: 0; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body class="roadmap-grid">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
</body>
</html>
